<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exploration Mind Map</title>
    <script>
      // The saved light/dark choice, applied before the first paint — the same logic as src/ui/theme.ts.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("navmap.theme") || "system";
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script id="app-data" type="application/json">__APP_DATA_JSON__</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
